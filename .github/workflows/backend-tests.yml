name: Backend Tests

on:
  push:
    branches: [ main ]
    # Запускать ТОЛЬКО если изменились файлы в папке tests_back
    paths:
      - 'tests_back'
  workflow_dispatch:

jobs:
  run-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Copy source code
        uses: actions/checkout@v4
        
      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
          
      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Backend tests
        env:
          PYTHONPATH: .
        run: pytest -v tests_back
